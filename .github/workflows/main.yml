name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-flask
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Pruebas Unitarias
        run: |
          pytest test_app.py

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-web:latest

      - name: Despliegue en AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-web:latest
            sudo docker stop mi-app-web || true
            sudo docker rm -f mi-app-web || true
            sudo docker run -d -p 3001:3001 --name mi-app-web ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-web:latest